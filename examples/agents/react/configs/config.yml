# General settings for the workflow
general:
  use_uvloop: true  # Use uvloop for faster async event loop (if available)

# Define available LLMs (Large Language Models) for the workflow
llms:
  nim_llm:
    _type: nim  # Use NVIDIA Inference Microservice (NIM) as the LLM provider
    model_name: meta/llama-3.1-70b-instruct  # Model to use for language tasks
    temperature: 0.0  # Controls randomness; 0.0 = deterministic output
    max_tokens: 250   # Maximum number of tokens to generate in a response

# Define functions/tools that the agent can use
functions:
  wikipedia_search:
    _type: wiki_search  # Built-in tool for searching Wikipedia
    max_results: 3      # Return up to 3 results per query
  current_datetime:
    _type: current_datetime  # Tool to get the current date and time
  code_generation:
    _type: code_generation   # Tool for generating code (using LLM)
    programming_language: "Python"  # Target language for code generation
    description: "Useful to generate Python code. For any questions about code generation, you must only use this tool!"
    llm_name: nim_llm        # Use the defined LLM for code generation
    verbose: true            # Enable verbose logging for this tool

# Define the main workflow (agent) to run
workflow:
  _type: react_agent  # Use the ReAct agent architecture (reasoning + acting)
  tool_names: [wikipedia_search, current_datetime, code_generation]  # Tools available to the agent
  llm_name: nim_llm   # LLM to use for reasoning and tool use
  verbose: true       # Enable verbose logging for the agent
  handle_parsing_errors: true  # Try to recover from parsing errors in agent output
  max_retries: 2      # Number of retries for failed tool calls or parsing

# Evaluation settings (optional, for automated testing/metrics)
eval:
  general:
    output_dir: ./.tmp/aiq/examples/react_agent/  # Where to save evaluation outputs
    dataset:
      _type: json
      file_path: examples/agents/data/wikipedia.json  # Dataset for evaluation
  evaluators:
    rag_accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: nim_llm
    rag_groundedness:
      _type: ragas
      metric: ContextRelevance
      llm_name: nim_llm
    rag_relevance:
      _type: ragas
      metric: ResponseGroundedness
      llm_name: nim_llm
