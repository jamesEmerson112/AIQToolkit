# General settings for the workflow
general:
  use_uvloop: true  # Use uvloop for faster async event loop (if available)

# Define available LLMs (Large Language Models) for the workflow
llms:
  agent_orchestrator:
    _type: nim  # LLM for the top-level agent (orchestrator)
    model_name: meta/llama-3.1-405b-instruct  # Model for orchestration and reasoning
    temperature: 0.2  # Slightly higher temperature for more creative orchestration
    max_tokens: 250   # Max tokens for orchestrator responses
  agent_executor:
    _type: nim  # LLM for sub-agents (executors)
    model_name: meta/llama-3.3-70b-instruct  # Model for executing sub-agent tasks
    temperature: 0.0  # Deterministic output for sub-agent actions
    max_tokens: 250   # Max tokens for executor responses

# Define functions/tools and sub-agents
functions:
  calculator_multiply:
    _type: calculator_multiply  # Tool for multiplication
  calculator_inequality:
    _type: calculator_inequality  # Tool for evaluating inequalities
  calculator_divide:
    _type: aiq_simple_calculator/calculator_divide  # Tool for division (from aiq_simple_calculator)
  math_agent:
    _type: tool_calling_agent  # Sub-agent for math tasks
    tool_names:
      - calculator_multiply
      - calculator_inequality
      - calculator_divide
    llm_name: agent_executor  # Uses the executor LLM for math operations
    verbose: true
    handle_tool_errors: true
    description: 'Useful for performing simple mathematical calculations.'

  wikipedia_search:
    _type: wiki_search  # Tool for searching Wikipedia
    max_results: 3
  current_datetime:
    _type: current_datetime  # Tool to get the current date and time
  internet_agent:
    _type: tool_calling_agent  # Sub-agent for internet-related tasks
    tool_names:
      - wikipedia_search
      - current_datetime
    llm_name: agent_executor  # Uses the executor LLM for internet tasks
    verbose: true
    handle_tool_errors: true
    description: "Useful for performing simple internet searches."

  code_generation:
    _type: code_generation  # Tool for generating code (using LLM)
    programming_language: "Python"  # Target language for code generation
    description: "Useful to generate Python code. For any questions about code generation, you must only use this tool!"
    llm_name: agent_orchestrator  # Uses the orchestrator LLM for code generation
    verbose: true

# Define the main workflow (top-level agent)
workflow:
  _type: react_agent  # Use the ReAct agent architecture for orchestration
  tool_names: [math_agent, internet_agent, code_generation]  # Sub-agents and tools available to the top-level agent
  llm_name: agent_orchestrator  # Orchestrator LLM for reasoning and delegation
  verbose: true
  handle_parsing_errors: true  # Try to recover from parsing errors in agent output
  max_retries: 2  # Number of retries for failed tool calls or parsing
  system_prompt: |
    Answer the following questions as best you can. You may communicate and collaborate with various experts to answer the questions:

    {tools}

    You may respond in one of two formats.
    Use the following format exactly to communicate with an expert:

    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action (if there is no required input, include "Action Input: None")
    Observation: wait for the expert to respond, do not assume the expert's response

    ... (this Thought/Action/Action Input/Observation can repeat N times.)
    Use the following format once you have the final answer:

    Thought: I now know the final answer
    Final Answer: the final answer to the original input question

    # The system prompt enforces a structured, stepwise reasoning and action format for the agent and its sub-agents.
